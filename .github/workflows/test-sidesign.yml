name: Test SideSign branch

on:
  workflow_dispatch:
    inputs:
      ref:
        default: scan-extensionkit-extensions

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - run: git clone --recursive --depth 1 -b "${{ inputs.ref }}" https://github.com/dddd-zdf/SideSign.git
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"
      - working-directory: SideSign
        run: swift test 2>&1 | tail -60
