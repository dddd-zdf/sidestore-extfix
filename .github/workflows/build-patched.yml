name: Build patched SideStore

# SideStore develop (12ff39c) with a patch so SideSign also signs ExtensionKit extensions in
# Extensions/ (patches/sidesign-extensions.patch), needed by Background Sync for Immich.
# Anisette defaults: Jkcoxson server, the server list in anisette-servers.json, Windows client info
# (SideStore/AppConstants.swift). A v* tag also publishes a GitHub release with the IPA.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - run: brew install ldid xcbeautify

      - name: Apply SideSign patch
        run: git -C Dependencies/SideSign apply --verbose ../../patches/sidesign-extensions.patch

      - name: Set version
        run: |
          V="$(python3 scripts/ci/workflow.py get-marketing-version)-extfix.${{ github.run_number }}"
          python3 scripts/ci/workflow.py set-marketing-version "$V"
          echo "MARKETING_VERSION=$V" >> $GITHUB_ENV

      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Build
        run: python3 scripts/ci/workflow.py build

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}
          path: SideStore.ipa
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SideStore.ipa "SideStore-${MARKETING_VERSION}.ipa"
          gh release create "${{ github.ref_name }}" "SideStore-${MARKETING_VERSION}.ipa" --title "SideStore ${MARKETING_VERSION}"             --notes "SideStore develop 12ff39c with SideSign signing ExtensionKit extensions (Extensions/). Install it like SideStore; see the README."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build/logs
